<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Bites - Minimalist Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* gray-50 */
            color: #111827; /* gray-900 */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-item { animation: fadeIn 0.4s ease-out forwards; }

        .cart-sidebar { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .cart-open { transform: translateX(0) !important; }
        .cart-closed { transform: translateX(100%) !important; }

        .modal-overlay { transition: opacity 0.2s ease-in-out; }
        .modal-content { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1); }

        .category-btn.active {
            background-color: #111827;
            color: white;
            border-color: #111827;
        }

        /* Checkbox/Radio Custom Styling */
        .custom-radio:checked + div {
            border-color: #111827;
            background-color: #f3f4f6;
        }
        .custom-radio:checked + div .check-icon {
            opacity: 1;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Navigation -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-black text-white flex items-center justify-center rounded-lg">
                        <i class="fa-solid fa-utensils text-sm"></i>
                    </div>
                    <h1 class="font-semibold text-lg tracking-tight">Urban Bites</h1>
                </div>
                <button onclick="toggleCart()" class="relative group p-2">
                    <span class="text-sm font-medium mr-2 group-hover:underline">Cart</span>
                    <i class="fa-solid fa-bag-shopping text-lg text-gray-800"></i>
                    <span id="cart-badge" class="absolute top-0 right-0 -mt-1 -mr-1 flex h-4 w-4 items-center justify-center rounded-full bg-black text-[10px] text-white font-bold opacity-0 transition-opacity">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Simple Header -->
    <div class="pt-16 pb-8 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto">
        <h2 class="text-3xl font-light tracking-tight text-gray-900 mb-2">Menu</h2>
        <p class="text-gray-500 font-light">Select options to customize your meal.</p>
    </div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        
        <!-- Minimal Category Filter -->
        <div class="flex flex-wrap gap-2 mb-10 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="filterMenu('all')" class="category-btn active px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium hover:border-gray-400 transition">All</button>
            <button onclick="filterMenu('burger')" class="category-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium hover:border-gray-400 transition">Burgers</button>
            <button onclick="filterMenu('pizza')" class="category-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium hover:border-gray-400 transition">Pizza</button>
            <button onclick="filterMenu('sides')" class="category-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium hover:border-gray-400 transition">Sides</button>
            <button onclick="filterMenu('drinks')" class="category-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 text-sm font-medium hover:border-gray-400 transition">Drinks</button>
        </div>

        <!-- Menu Grid -->
        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Items injected by JS -->
        </div>

    </main>

    <!-- Customization Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/40 z-50 hidden opacity-0 modal-overlay backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div id="modal-content" class="bg-white w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl shadow-2xl transform translate-y-full sm:translate-y-10 scale-95 transition-all duration-300 max-h-[90vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="p-6 border-b border-gray-100 flex justify-between items-start">
                <div>
                    <h3 id="modal-title" class="text-xl font-semibold text-gray-900"></h3>
                    <p id="modal-desc" class="text-sm text-gray-500 mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-black p-1">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div id="modal-options" class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- Options injected here -->
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl">
                <button onclick="confirmAddToCart()" class="w-full bg-black text-white font-medium py-3.5 rounded-xl hover:bg-gray-800 transition flex justify-between px-6 items-center group">
                    <span>Add to Order</span>
                    <span id="modal-price" class="font-semibold group-hover:scale-105 transition-transform"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar Overlay -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0"></div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-[400px] bg-white shadow-2xl z-50 transform cart-closed flex flex-col h-full border-l border-gray-100">
        
        <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center">
            <h2 class="text-lg font-semibold">Your Order</h2>
            <button onclick="toggleCart()" class="text-gray-400 hover:text-black transition">Close</button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Empty State -->
            <div id="empty-cart-msg" class="h-full flex flex-col items-center justify-center text-center space-y-4 text-gray-400">
                <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-2">
                    <i class="fa-solid fa-basket-shopping text-2xl text-gray-300"></i>
                </div>
                <p class="text-sm font-medium text-gray-500">Cart is empty</p>
                <button onclick="toggleCart()" class="text-black text-sm underline hover:no-underline">Browse Menu</button>
            </div>
        </div>

        <div id="cart-footer" class="border-t border-gray-100 p-6 bg-gray-50 hidden">
            <div class="space-y-3 mb-6">
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Subtotal</span>
                    <span id="cart-subtotal" class="font-medium">$0.00</span>
                </div>
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Tax (8%)</span>
                    <span id="cart-tax" class="font-medium">$0.00</span>
                </div>
                <div class="flex justify-between text-lg font-semibold text-gray-900 pt-3 border-t border-gray-200">
                    <span>Total</span>
                    <span id="cart-total">$0.00</span>
                </div>
            </div>
            <button onclick="checkout()" class="w-full bg-black text-white font-medium py-3 rounded-lg hover:bg-gray-800 transition shadow-lg shadow-gray-200">
                Checkout
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-black text-white px-6 py-3 rounded-lg shadow-xl z-50 transition-all duration-300 opacity-0 translate-y-10 flex items-center gap-3 text-sm font-medium">
        <i class="fa-solid fa-check-circle text-gray-400"></i>
        <span id="toast-message">Added to cart</span>
    </div>

    <script>
        // --- Enhanced Data Structure ---
        const menuItems = [
            {
                id: 1,
                name: "Classic Cheeseburger",
                description: "Angus beef, cheddar, house sauce.",
                price: 12.00,
                category: "burger",
                emoji: "🍔",
                options: [
                    {
                        id: "doneness",
                        name: "Cook Level",
                        type: "radio",
                        choices: [
                            { label: "Medium Rare", price: 0 },
                            { label: "Medium", price: 0 },
                            { label: "Well Done", price: 0 }
                        ]
                    },
                    {
                        id: "extras",
                        name: "Add-ons",
                        type: "checkbox",
                        choices: [
                            { label: "Extra Cheese", price: 1.50 },
                            { label: "Bacon", price: 2.00 },
                            { label: "Avocado", price: 1.50 }
                        ]
                    }
                ]
            },
            {
                id: 2,
                name: "Double Smash",
                description: "Two patties, onions, american cheese.",
                price: 15.00,
                category: "burger",
                emoji: "🥓",
                options: [
                    {
                        id: "extras",
                        name: "Extras",
                        type: "checkbox",
                        choices: [
                            { label: "Extra Patty", price: 4.00 },
                            { label: "Bacon", price: 2.00 }
                        ]
                    }
                ]
            },
            {
                id: 4,
                name: "Margherita Pizza",
                description: "Tomato, mozzarella, basil.",
                price: 14.00,
                category: "pizza",
                emoji: "🍕",
                options: [
                    {
                        id: "size",
                        name: "Size",
                        type: "radio",
                        choices: [
                            { label: "Regular (12\")", price: 0 },
                            { label: "Large (16\")", price: 4.00 }
                        ]
                    },
                    {
                        id: "toppings",
                        name: "Extra Toppings",
                        type: "checkbox",
                        choices: [
                            { label: "Extra Cheese", price: 2.00 },
                            { label: "Olives", price: 1.00 },
                            { label: "Mushrooms", price: 1.50 }
                        ]
                    }
                ]
            },
            {
                id: 6,
                name: "Truffle Fries",
                description: "Parmesan, truffle oil, parsley.",
                price: 7.00,
                category: "sides",
                emoji: "🍟",
                options: [
                    {
                        id: "sauce",
                        name: "Dipping Sauce",
                        type: "radio",
                        choices: [
                            { label: "Ketchup", price: 0 },
                            { label: "Garlic Aioli", price: 0.50 },
                            { label: "Spicy Mayo", price: 0.50 }
                        ]
                    }
                ]
            },
            {
                id: 7,
                name: "Onion Rings",
                description: "Beer-battered with ranch.",
                price: 6.00,
                category: "sides",
                emoji: "🧅"
            },
            {
                id: 9,
                name: "Craft Cola",
                description: "Cane sugar cola.",
                price: 3.50,
                category: "drinks",
                emoji: "🥤",
                options: [
                    {
                        id: "ice",
                        name: "Ice Level",
                        type: "radio",
                        choices: [
                            { label: "Regular Ice", price: 0 },
                            { label: "No Ice", price: 0 }
                        ]
                    }
                ]
            }
        ];

        // --- State ---
        let cart = []; // Array of { ...item, selectedOptions: [], cartId: uniqueString, quantity: int }
        let currentFilter = 'all';
        let currentModalItem = null; // Item currently being customized
        let currentSelection = {}; // { optionId: [choiceIndex] }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMenu();
        });

        // --- Rendering ---
        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';

            const filteredItems = currentFilter === 'all' 
                ? menuItems 
                : menuItems.filter(item => item.category === currentFilter);

            filteredItems.forEach((item, index) => {
                const delay = index * 50; 
                const hasOptions = item.options && item.options.length > 0;
                
                const card = document.createElement('div');
                card.className = `menu-item bg-white rounded-xl border border-gray-100 hover:border-gray-300 transition-all duration-300 flex flex-col p-4 group`;
                card.style.animationDelay = `${delay}ms`;

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center text-2xl group-hover:bg-gray-100 transition-colors">
                            ${item.emoji}
                        </div>
                        <span class="font-medium text-sm">$${item.price.toFixed(2)}</span>
                    </div>
                    <div class="flex-1 mb-4">
                        <h3 class="font-semibold text-gray-900 mb-1">${item.name}</h3>
                        <p class="text-gray-500 text-xs leading-relaxed">${item.description}</p>
                    </div>
                    <button onclick="initiateAddToCart(${item.id})" class="w-full py-2 px-4 rounded-lg border border-gray-200 text-sm font-medium text-gray-700 hover:bg-black hover:text-white hover:border-black transition-colors flex items-center justify-center gap-2">
                        ${hasOptions ? 'Customize' : 'Add to Order'}
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterMenu(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.textContent.toLowerCase().includes(category) || (category === 'all' && btn.textContent === 'All')) {
                    btn.classList.add('active');
                    btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
                } else {
                    btn.classList.remove('active');
                    btn.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
                }
            });
            renderMenu();
        }

        // --- Modal & Customization Logic ---

        function initiateAddToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (item.options && item.options.length > 0) {
                openModal(item);
            } else {
                addItemToCart(item, []);
            }
        }

        function openModal(item) {
            currentModalItem = item;
            currentSelection = {};

            // Pre-select first radio options
            item.options.forEach(opt => {
                if (opt.type === 'radio') {
                    currentSelection[opt.id] = [0]; // Select index 0 by default
                } else {
                    currentSelection[opt.id] = [];
                }
            });

            // UI Updates
            document.getElementById('modal-title').textContent = item.name;
            document.getElementById('modal-desc').textContent = item.description;
            
            renderModalOptions(item);
            updateModalPrice();

            // Show Modal
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            overlay.classList.remove('hidden');
            // Force reflow
            void overlay.offsetWidth;
            overlay.classList.remove('opacity-0');
            content.classList.remove('translate-y-full', 'scale-95');
            content.classList.add('sm:translate-y-0', 'translate-y-0', 'scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            overlay.classList.add('opacity-0');
            content.classList.add('translate-y-full', 'scale-95');
            content.classList.remove('sm:translate-y-0', 'translate-y-0', 'scale-100');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            }, 200);
        }

        function renderModalOptions(item) {
            const container = document.getElementById('modal-options');
            container.innerHTML = '';

            item.options.forEach(opt => {
                const section = document.createElement('div');
                section.innerHTML = `<h4 class="font-medium text-sm text-gray-900 mb-3">${opt.name}</h4>`;
                
                const choicesContainer = document.createElement('div');
                choicesContainer.className = 'grid grid-cols-1 gap-2';

                opt.choices.forEach((choice, idx) => {
                    const choiceId = `${opt.id}-${idx}`;
                    const wrapper = document.createElement('label');
                    wrapper.className = 'relative cursor-pointer group';
                    
                    const isChecked = currentSelection[opt.id].includes(idx);
                    const inputType = opt.type === 'radio' ? 'radio' : 'checkbox';
                    const inputName = opt.id;

                    wrapper.innerHTML = `
                        <input type="${inputType}" name="${inputName}" 
                            class="peer sr-only custom-radio" 
                            ${isChecked ? 'checked' : ''}
                            onchange="updateSelection('${opt.id}', '${opt.type}', ${idx})"
                        >
                        <div class="p-3 rounded-lg border border-gray-200 hover:border-gray-400 transition-colors flex justify-between items-center bg-white">
                            <span class="text-sm text-gray-700">${choice.label}</span>
                            <div class="flex items-center gap-2">
                                ${choice.price > 0 ? `<span class="text-xs text-gray-500">+$${choice.price.toFixed(2)}</span>` : ''}
                                <div class="w-4 h-4 rounded-full border border-gray-300 flex items-center justify-center check-icon opacity-0 transition-opacity">
                                    <div class="w-2 h-2 bg-black rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    choicesContainer.appendChild(wrapper);
                });

                section.appendChild(choicesContainer);
                container.appendChild(section);
            });
        }

        function updateSelection(optionId, type, choiceIndex) {
            if (type === 'radio') {
                currentSelection[optionId] = [choiceIndex];
            } else {
                const index = currentSelection[optionId].indexOf(choiceIndex);
                if (index > -1) {
                    currentSelection[optionId].splice(index, 1);
                } else {
                    currentSelection[optionId].push(choiceIndex);
                }
            }
            // Re-render to update UI visuals if needed, or just let CSS handle it
            // CSS handles visual state via :checked, but we need to calculate price
            updateModalPrice();
        }

        function updateModalPrice() {
            if (!currentModalItem) return;

            let total = currentModalItem.price;

            // Calculate options
            currentModalItem.options.forEach(opt => {
                const selectedIndices = currentSelection[opt.id] || [];
                selectedIndices.forEach(idx => {
                    total += opt.choices[idx].price;
                });
            });

            document.getElementById('modal-price').textContent = `$${total.toFixed(2)}`;
        }

        function confirmAddToCart() {
            // Flatten selection into a nice array of objects for the cart
            const selectedOptions = [];
            
            currentModalItem.options.forEach(opt => {
                const selectedIndices = currentSelection[opt.id] || [];
                selectedIndices.forEach(idx => {
                    selectedOptions.push({
                        optionName: opt.name,
                        label: opt.choices[idx].label,
                        price: opt.choices[idx].price
                    });
                });
            });

            addItemToCart(currentModalItem, selectedOptions);
            closeModal();
        }

        // --- Cart Logic ---

        function generateCartItemId(itemId, options) {
            // Create a unique string signature based on ID and sorted options
            // options is array of objects { label, price }
            const optionsString = options
                .map(o => o.label)
                .sort()
                .join('|');
            return `${itemId}-${optionsString}`;
        }

        function addItemToCart(item, options) {
            const uniqueId = generateCartItemId(item.id, options);
            const existingItem = cart.find(i => i.cartId === uniqueId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                // Calculate unit price including options
                const unitPrice = item.price + options.reduce((sum, opt) => sum + opt.price, 0);
                
                cart.push({
                    originalId: item.id,
                    cartId: uniqueId,
                    name: item.name,
                    emoji: item.emoji,
                    unitPrice: unitPrice,
                    selectedOptions: options,
                    quantity: 1
                });
            }

            updateCartUI();
            showToast(`Added ${item.name}`);
        }

        function removeItem(cartId) {
            const index = cart.findIndex(i => i.cartId === cartId);
            if (index > -1) {
                cart.splice(index, 1);
                updateCartUI();
            }
        }

        function updateQuantity(cartId, change) {
            const item = cart.find(i => i.cartId === cartId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    removeItem(cartId);
                } else {
                    updateCartUI();
                }
            }
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const footer = document.getElementById('cart-footer');
            const emptyMsg = document.getElementById('empty-cart-msg');

            const totalCount = cart.reduce((sum, i) => sum + i.quantity, 0);
            badge.textContent = totalCount;
            badge.classList.toggle('opacity-0', totalCount === 0);

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
                footer.classList.add('hidden');
                container.innerHTML = '';
                container.appendChild(emptyMsg);
            } else {
                emptyMsg.classList.add('hidden');
                footer.classList.remove('hidden');
                container.innerHTML = ''; // clear
                container.appendChild(emptyMsg); // keep ref but hidden

                let subtotal = 0;

                cart.forEach(item => {
                    subtotal += item.unitPrice * item.quantity;

                    const el = document.createElement('div');
                    el.className = 'flex gap-4';
                    
                    // Option Text Generation
                    const optionsHtml = item.selectedOptions.length > 0 
                        ? `<div class="text-xs text-gray-500 mt-1 space-y-0.5">
                            ${item.selectedOptions.map(o => `<div>+ ${o.label}</div>`).join('')}
                           </div>`
                        : '';

                    el.innerHTML = `
                        <div class="w-16 h-16 bg-gray-50 rounded-lg flex items-center justify-center text-2xl flex-shrink-0 border border-gray-100">
                            ${item.emoji}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start">
                                <h4 class="font-medium text-sm text-gray-900 truncate pr-2">${item.name}</h4>
                                <span class="text-sm font-semibold text-gray-900">$${(item.unitPrice * item.quantity).toFixed(2)}</span>
                            </div>
                            ${optionsHtml}
                            <div class="flex items-center gap-3 mt-3">
                                <div class="flex items-center border border-gray-200 rounded-md">
                                    <button onclick="updateQuantity('${item.cartId}', -1)" class="px-2 py-1 text-gray-500 hover:text-black hover:bg-gray-50 transition rounded-l-md">
                                        <i class="fa-solid fa-minus text-[10px]"></i>
                                    </button>
                                    <span class="text-xs font-medium w-6 text-center">${item.quantity}</span>
                                    <button onclick="updateQuantity('${item.cartId}', 1)" class="px-2 py-1 text-gray-500 hover:text-black hover:bg-gray-50 transition rounded-r-md">
                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(el);
                });

                const tax = subtotal * 0.08;
                document.getElementById('cart-subtotal').textContent = `$${subtotal.toFixed(2)}`;
                document.getElementById('cart-tax').textContent = `$${tax.toFixed(2)}`;
                document.getElementById('cart-total').textContent = `$${(subtotal + tax).toFixed(2)}`;
            }
        }

        // --- UI Utilities ---

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            const body = document.body;
            
            if (sidebar.classList.contains('cart-closed')) {
                sidebar.classList.remove('cart-closed');
                sidebar.classList.add('cart-open');
                overlay.classList.remove('hidden');
                void overlay.offsetWidth; 
                overlay.classList.remove('opacity-0');
                body.style.overflow = 'hidden';
            } else {
                sidebar.classList.remove('cart-open');
                sidebar.classList.add('cart-closed');
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    body.style.overflow = '';
                }, 300);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('translate-y-10', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
        }

        function checkout() {
            if (cart.length === 0) return;
            const total = document.getElementById('cart-total').innerText;
            alert(`Order Placed!\nAmount: ${total}`);
            cart = [];
            updateCartUI();
            toggleCart();
        }
    </script>
</body>
</html>
